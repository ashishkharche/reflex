name: Native behavior parity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  samples:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check_docs.py
      - run: python3 runner/check_preferences.py
      - run: bash scripts/build.sh
      - run: swift test --package-path kit -j 2
      - run: swift test --package-path swift -j 2
      - run: swift test --package-path samples/outbox/swift -j 2
      - run: kotlin/gradlew -p kotlin --no-daemon --max-workers=1 :reflex-kit:test :core:test --console=plain
      - run: kotlin/gradlew -p samples/outbox/kotlin --no-daemon --max-workers=1 :core:test --console=plain
      - run: python3 runner/reflex_runner.py tests/inventory/reflex.json --platform both --repeat 3 --timings 20
      - run: python3 runner/reflex_runner.py samples/outbox/reflex.json --platform both --repeat 3 --timings 20
      - run: python3 runner/reflex_runner.py samples/outbox/live.json --platform both --repeat 2 --allow-unguarded
  linux-samples:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python3 scripts/check_docs.py
      - run: kotlin/gradlew -p kotlin --no-daemon --max-workers=1 :cli:installDist :reflex-kit:test :core:test --console=plain
      - run: kotlin/gradlew -p samples/outbox/kotlin --no-daemon --max-workers=1 :cli:installDist :core:test --console=plain
      - run: python3 runner/reflex_runner.py tests/inventory/reflex.json --platform kotlin
      - run: python3 runner/reflex_runner.py samples/outbox/reflex.json --platform kotlin
  release-exclusion:
    # Builds the sample apps in Debug and Release and fails if a release build holds the debug socket host.
    # It boots no simulator or emulator.
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: brew install xcodegen
      - run: bash scripts/check_release_exclusion.sh both
      - if: failure()
        run: tail -n 60 .build/*.log || true
