name: CounterUIKit
options:
  bundleIdPrefix: com.ashishkharche.reflex
  deploymentTarget:
    iOS: "17.0"
packages:
  CounterCore:
    path: ../CounterCore
targets:
  CounterUIKit:
    type: application
    platform: iOS
    sources: [CounterApp.swift]
    dependencies:
      - package: CounterCore
        product: CounterCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ashishkharche.reflex.counter.uikit
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
