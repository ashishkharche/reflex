name: CounterCMP
options:
  bundleIdPrefix: com.ashishkharche.reflex
  deploymentTarget:
    iOS: "17.0"
targets:
  CounterCMP:
    type: application
    platform: iOS
    sources: [CounterCMPApp.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ashishkharche.reflex.counter.cmp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
        # Static framework from kotlin/gradlew -p samples/stacks/cmp :composeApp:linkDebugFrameworkIosSimulatorArm64 -Pmobile=true
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../composeApp/build/bin/iosSimulatorArm64/debugFramework
        OTHER_LDFLAGS: $(inherited) -framework ComposeApp
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
