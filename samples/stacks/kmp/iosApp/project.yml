name: CounterKMP
options:
  bundleIdPrefix: com.ashishkharche.reflex
  deploymentTarget:
    iOS: "17.0"
targets:
  CounterKMP:
    type: application
    platform: iOS
    sources: [CounterKMPApp.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ashishkharche.reflex.counter.kmp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
        # Static framework from kotlin/gradlew -p samples/stacks/kmp :shared:linkDebugFrameworkIosSimulatorArm64
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/bin/iosSimulatorArm64/debugFramework
        OTHER_LDFLAGS: $(inherited) -framework Shared
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
